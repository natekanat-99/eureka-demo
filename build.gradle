plugins {
    id 'com.netflix.nebula.netflixoss' version '11.6.0'
    id 'org.gretty' version '4.1.4'
}

idea {
    project {
        languageLevel = '17'
    }
}

allprojects {
    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

allprojects {
    ext {
        githubProjectName = 'eureka'

        awsVersion = '1.12.770'
        servletVersion = '2.5'
        jerseyVersion = '1.19.1'
        jettisonVersion = '1.5.4'
        apacheHttpClientVersion = '4.5.3'
        commonsConfigurationVersion = '1.10'
        jsr305Version = '3.0.2'
        guiceVersion = '5.1.0'
        servoVersion = '0.12.21'
        governatorVersion = '1.17.5'
        archaiusVersion = '0.7.6'
        jacksonVersion = '2.15.3'
        jacksonDatabindVersion = '2.15.3'
        woodstoxVersion = '6.5.1'

        // test deps
        // NOTE: user asked for 10.0.20, but wiremock-jre8:2.35.1 is BOM-pinned
        // to Jetty 9.4 and there is no wiremock release that targets Jetty 10.
        // Mixing the two causes silent HTTP routing failures in tests. 9.4.49
        // runs fine on Java 17 and exposes the same AbstractHandler API we use.
        jetty_version = '9.4.49.v20220914'
        junit_version = '4.11'
        mockitoVersion = '4.11.0'
        mockserverVersion = '5.15.0'
    }
}

subprojects {
    apply plugin: 'nebula.netflixoss'
    apply plugin: 'java-library'

    group = "com.netflix.${githubProjectName}"

    sourceCompatibility = 17
    targetCompatibility = 17

    repositories {
        mavenCentral()
    }

    test {
        forkEvery = 1
        // setting this property prevents java from grabbing focus when running the tests under osx
        systemProperty 'java.awt.headless', 'true'
    }

    tasks.withType(Test) {
        jvmArgs += [
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
        ]
    }

    jar {
        manifest {
            attributes('Build-Time-ISO-8601': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"))
        }
    }
}
